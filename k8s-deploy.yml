# Guacamole deployment manifest for kubernetes
---
apiVersion: v1
kind: Namespace
metadata:
  name: guac
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: guac       # Put your namespace here
spec:
  storageClassName: nfs-dynamic
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-pvc
  namespace: guac       # Put your namespace here
spec:
  storageClassName: nfs-dynamic
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-infrastructure
  namespace: guac
  labels:
    app: guacamole-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-app
  template:
    metadata:
      labels:
        app: guacamole-app
    spec:
      containers:
        # --- MariaDB Database Container ---
        - name: mariadb
          image: mariadb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: db-port
          env:
            # Note: Configure proper secret management for production environments
            - name: MARIADB_ROOT_PASSWORD
              value: "guac"
            - name: MARIADB_DATABASE (
              value: "guac"
            - name: MARIADB_USER
              value: "guac"
            - name: MARIADB_PASSWORD
              value: "guac"
 
        # --- Guacamole App Container ---
        - name: guacamole-k8s
          image: docker.io/jsanderson104/guacamole-k8s:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 4822
              name: guacd
            - containerPort: 8080
              name: http-8080
            - containerPort: 9090
              name: http-9090
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-loadbalancer
  namespace: guac
  labels:
    app: guacamole-app
spec:
  type: LoadBalancer
  selector:
    app: guacamole-app
  ports:
    - name: guacd-port
      protocol: TCP
      port: 4822
      targetPort: 4822
    - name: web-8080
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: web-9090
      protocol: TCP
      port: 9090
      targetPort: 9090
    - name: sql-3306
      protocol: TCP
      port: 3306
      targetPort: 3306
